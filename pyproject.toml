[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geekseek"
version = "0.1.0"
description = "Event-driven camera robot kiosk runtime"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "PyYAML>=6.0",
  "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
cad = [
  "cadquery>=2.8,<3",
]
dev = [
  "httpx>=0.28",
  "pytest>=8.0,<9",
]

[project.scripts]
geekseek = "geekseek.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
